[project]
name = "sonovate-inference"
version = "0.1.0"
description = "Sonovate inference service (FastAPI). Ships with no model registered."
requires-python = ">=3.12"
dependencies = [
    # HTTP API framework and its server.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Server-side calls to local Supabase (PostgREST, Storage, JWKS).
    "httpx>=0.27",
    # Supabase access-token verification; [crypto] adds ES256/RS256 support.
    "pyjwt[crypto]>=2.9",
    # Model bundles (ADR-007): log-mel features and the autoencoder, CPU only.
    # Same versions as the root ML project so scores match the bundle parity.
    "numpy==2.5.4",
    "torch==2.15.0",
    # Frozen AST encoder (ADR-008): ASTFeatureExtractor and ASTModel, loaded
    # only from the local bundle directory. Same version as the ML project.
    "transformers==5.22.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# The Linux container (Hugging Face Spaces) installs CPU-only torch; the
# default PyPI wheel bundles CUDA libraries the service never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
