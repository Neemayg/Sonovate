[project]
name = "sonovate"
version = "0.1.0"
description = "Environment-aware acoustic machine health research code"
requires-python = ">=3.12"
dependencies = [
    "dasheng>=0.0.9",
    "imageio-ffmpeg>=0.8.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.12",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
